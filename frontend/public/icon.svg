<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#0b2c3d"/>
      <stop offset="100%" stop-color="#083a4f"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Radial Glow Behind Tree -->
  <circle cx="256" cy="256" r="170" fill="url(#glowGrad)"/>

  <!-- Pharma Cross Core Body -->
  <!-- Vertical Beam -->
  <rect x="208" y="112" width="96" height="288" rx="48" fill="url(#crossGrad)" filter="url(#subtleGlow)"/>
  <!-- Horizontal Beam -->
  <rect x="112" y="208" width="288" height="96" rx="48" fill="url(#crossGrad)" filter="url(#subtleGlow)"/>

  <!-- Central Core Nexus (Blockchain / Provenance Token) -->
  <circle cx="256" cy="256" r="42" fill="#071b26" stroke="#ffffff" stroke-width="6"/>
  <circle cx="256" cy="256" r="22" fill="url(#leafGrad)"/>

  <!-- Tree of Life / Provenance Branch Nodes -->
  <!-- Top Node & Sprout Leaf -->
  <path d="M 256 128 C 256 90, 280 64, 310 60 C 310 90, 286 120, 256 128 Z" fill="url(#leafGrad)"/>
  <circle cx="256" cy="116" r="14" fill="#ffffff"/>

  <!-- Left & Right Cross Node Markers -->
  <circle cx="128" cy="256" r="14" fill="#ffffff"/>
  <circle cx="384" cy="256" r="14" fill="#ffffff"/>

  <!-- Tree Roots / Provenance Base Nodes -->
  <!-- Trunk Center Root -->
  <circle cx="256" cy="386" r="14" fill="#ffffff"/>
  
  <!-- Diagonal Tree Branches (Supply Chain Network) -->
  <!-- Branch Top-Left -->
  <path d="M 220 220 Q 170 170 148 136" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <circle cx="144" cy="132" r="16" fill="#38bdf8"/>
  <circle cx="144" cy="132" r="8" fill="#ffffff"/>

  <!-- Branch Top-Right -->
  <path d="M 292 220 Q 342 170 364 136" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <circle cx="368" cy="132" r="16" fill="#34d399"/>
  <circle cx="368" cy="132" r="8" fill="#ffffff"/>

  <!-- Branch Bottom-Left -->
  <path d="M 220 292 Q 180 340 148 376" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <circle cx="144" cy="380" r="14" fill="#38bdf8"/>
  <circle cx="144" cy="380" r="6" fill="#ffffff"/>

  <!-- Branch Bottom-Right -->
  <path d="M 292 292 Q 332 340 364 376" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
  <circle cx="368" cy="380" r="14" fill="#10b981"/>
  <circle cx="368" cy="380" r="6" fill="#ffffff"/>
</svg>
